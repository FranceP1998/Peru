<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perù: il nostro viaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#17272F; --mut:#586870; --paper:#EDF1EF; --card:#FAFBFA; --line:#CAD5D0;
  --acc:#1D7390; --acc-ink:#0F4C61; --ex:#B83D6A; --ok:#2F7D4F; --warn:#9A5F08; --r:4px;
}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3,h4,.disp{font-family:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;letter-spacing:-.015em;margin:0}
a{color:var(--acc-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---- hero ---- */
.hero{padding-top:30px}
.hero-top{display:flex;flex-wrap:wrap;gap:24px 40px;justify-content:space-between;align-items:flex-end}
.hero h1{font-size:clamp(64px,13vw,132px);line-height:.86;font-weight:800;color:var(--ink)}
.hero .sub{margin:12px 0 0;font-size:18px;color:var(--mut);max-width:34ch}
.controls{display:flex;flex-wrap:wrap;gap:14px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut);font-weight:500}
.controls input,.controls select{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;min-width:150px;font-size:16px;color:var(--ink)}
.controls input[type=number]{min-width:90px;width:90px}
.hint{font-size:14px;color:var(--warn);margin:10px 0 0}
.stats{display:flex;flex-wrap:wrap;margin:26px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:12px 24px 12px 0;margin-right:24px;min-width:120px}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:28px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--mut)}
.profile{overflow-x:auto;padding-bottom:4px}
.profile svg{display:block;min-width:780px;width:100%;height:auto}
.profile a{cursor:pointer}
.profile .band{transition:opacity .15s}
.profile a:hover .band,.profile a:focus .band{opacity:.34}

/* ---- tabs ---- */
.tabs{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);margin-top:12px}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
.tab{border:0;background:none;padding:14px 14px 12px;cursor:pointer;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
main{padding:26px 0 70px}
main h2{font-size:28px;margin-bottom:6px;font-weight:600}
.lead{color:var(--mut);margin:0 0 22px;max-width:70ch}

/* ---- days ---- */
.day{border-left:7px solid var(--rc);background:var(--card);margin:0 0 10px;border-radius:0 var(--r) var(--r) 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day-head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:110px 1fr auto;gap:4px 18px;align-items:center;width:100%;padding:14px 18px;cursor:pointer}
.day-head:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.dn{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px;line-height:1.1}
.dd{display:block;font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:14px;color:var(--mut)}
.dt{font-weight:600;font-size:18px;line-height:1.3}
.dp{display:block;font-weight:400;font-size:14px;color:var(--mut)}
.dc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dc small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.day-body{padding:6px 20px 22px 18px;border-top:1px dashed var(--line)}
.day-body[hidden]{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px 40px;margin-top:14px}
.desc p{margin:0 0 12px;max-width:64ch}
.warn{background:#FFF6E2;border:1px solid #E8CF98;color:#5E3C03;border-radius:var(--r);padding:10px 12px;margin:12px 0;font-size:15px}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:52px 14px 1fr;gap:0 10px;padding:6px 0;align-items:baseline}
.tl>li.blk{display:block;padding:2px 0}
.tl time{font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600;font-size:15px}
.tl .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);background:#fff;transform:translateY(1px)}
.k-visit .dot{background:var(--rc);border-color:var(--rc)}
.k-food .dot{background:#D9A441;border-color:#D9A441}
.k-sleep .dot{border-color:var(--ink)}
.k-tip .dot{border:2px dashed var(--acc);background:#fff}
.k-move{color:#34454D}
.k-sleep span.tx{color:var(--mut)}
.slot{border:1.5px dashed var(--ex);border-radius:var(--r);padding:11px 14px;margin:6px 0 8px 62px;background:rgba(184,61,106,.05)}
.slot.on{border-style:solid;background:rgba(184,61,106,.08)}
.slot h4{font-size:16px;font-weight:600;margin-bottom:2px}
.slot p{margin:0 0 8px;font-size:14.5px;color:#41525A}
.slot .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.impact{font-size:14px;font-weight:600;color:var(--ex);font-variant-numeric:tabular-nums}
.impact.neg{color:var(--ok)}
.is-extra .dot{background:var(--ex)!important;border-color:var(--ex)!important}
.is-extra{color:#6B1D3A}
.radio{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer}
.radio input{margin-top:5px}
.radio .impact{font-size:13.5px}
.mini{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
.mini td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.mini td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini tr.tot td{font-weight:600;border-bottom:0}
.paidtag{font-size:12px;font-weight:600;color:var(--ok);margin-left:6px}
.esttag{font-size:12px;color:var(--warn);margin-left:6px}
textarea.note{width:100%;min-height:66px;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:#fff;margin-top:12px;resize:vertical}

/* ---- buttons, inputs ---- */
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:var(--r);padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{background:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--acc-ink)}
.btn.ghost:hover{background:rgba(29,115,144,.09)}
.btn.ex{background:var(--ex);border-color:var(--ex)}
.btn.ex:hover{background:#962F55}
.btn.ex.ghost{background:transparent;color:var(--ex)}
.btn.sm{padding:5px 10px;font-size:14px}
a.btn{text-decoration:none;display:inline-block}
input[type=text],input[type=number],input[type=date],input[type=time],select{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:7px 9px}
.num{width:92px;text-align:right;font-variant-numeric:tabular-nums}
.inl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}

/* ---- tables ---- */
.tblwrap{overflow-x:auto;margin:10px 0 28px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;font-size:14px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid #E1E8E4;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.sum td{font-weight:700;background:#E7EEEB}
.tbl tr.paid td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:#E1E9E5;color:#33464E}
.chip.ok{background:#DCEFE3;color:#1F5C38}
.chip.todo{background:#FBE9D0;color:#7A4A05}
.chip.soon{background:#F9DDE6;color:#8B2349}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px 28px}
.panel{border-top:3px solid var(--acc);padding:14px 0 0}
.panel h3{font-size:20px;font-weight:600;margin-bottom:8px}
.panel p{margin:0 0 10px}
.exgrid{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.excard{border:1.5px dashed var(--ex);border-radius:var(--r);padding:14px;background:rgba(184,61,106,.04);display:flex;flex-direction:column;gap:6px}
.excard.on{border-style:solid;background:rgba(184,61,106,.09)}
.excard h4{font-size:17px;font-weight:600}
.excard p{margin:0;font-size:14.5px;color:#41525A}
.excard .where{font-size:13px;color:var(--mut)}
.excard .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:6px}
.rate{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;background:#E7EEEB;border-radius:var(--r);margin-bottom:22px}
.rate b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px}
.small{font-size:14px;color:var(--mut)}
#map{height:460px;border:1px solid var(--line);border-radius:var(--r);margin:10px 0 24px;background:#DDE6E2}
.foot{border-top:1px solid var(--line);padding:22px 0 50px;color:var(--mut);font-size:14px}
.foot .inl{margin-top:10px}
dialog{border:1px solid var(--line);border-radius:6px;padding:22px;max-width:520px;width:calc(100% - 32px);background:var(--card)}
dialog::backdrop{background:rgba(23,39,47,.45)}
dialog label{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mut);margin-bottom:12px;font-weight:500}
dialog input,dialog select,dialog textarea{width:100%}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:15px;z-index:50}

@media (max-width:760px){
  .day-head{grid-template-columns:1fr auto}
  .day-head .dn{grid-column:1}
  .day-head .dt{grid-column:1 / span 2;order:3}
  .cols{grid-template-columns:1fr}
  .stat{min-width:calc(50% - 24px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
